<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="26" fill="#f3f7f4"/><style>.t{font-family:"Microsoft YaHei UI","Noto Sans SC",sans-serif;fill:#173f34}.h{font-size:26px;font-weight:700}.b{font-size:14px}.bh{font-size:17px;font-weight:700}.box{fill:#fff;stroke:#69a68e;stroke-width:1.5}.a{stroke:#148158;stroke-width:3;fill:none}.d{stroke:#bd6b4f;stroke-width:2.5;stroke-dasharray:6 5;fill:none}</style><text class="t h" x="48" y="52">判断闭环：AI 建议不等于真实执行</text><path class="a" d="M230 160H285M475 160H530M720 160H775M965 160H1020"/><path class="a" d="M1090 225V310H910M775 365H720M530 365H475M285 365H230"/><path class="d" d="M870 225V270H615V225M625 310V270"/>
<rect class="box" x="45" y="95" width="185" height="130" rx="14"/><text class="t bh" x="62" y="128">1 · AI 建议</text><text class="t b" x="62" y="158">证据 + 生成时间</text><text class="t b" x="62" y="181">理由 + 置信度</text><text class="t b" x="62" y="204">失效条件 + 候选参数</text>
<rect class="box" x="285" y="95" width="190" height="130" rx="14"/><text class="t bh" x="302" y="128">2 · 风险候选</text><text class="t b" x="302" y="158">账户真实容量</text><text class="t b" x="302" y="181">用户上限 + 保证金</text><text class="t b" x="302" y="204">用户启用的约束</text>
<rect class="box" x="530" y="95" width="190" height="130" rx="14"/><text class="t bh" x="547" y="128">3 · 待执行指令</text><text class="t b" x="547" y="158">唯一请求 ID</text><text class="t b" x="547" y="181">幂等重试</text><text class="t b" x="547" y="204">此时不计算为持仓</text>
<rect class="box" x="775" y="95" width="190" height="130" rx="14"/><text class="t bh" x="792" y="128">4 · MT4 再校验</text><text class="t b" x="792" y="158">点差 + 保证金</text><text class="t b" x="792" y="181">交易权限 + 真实持仓</text><text class="t b" x="792" y="204">经纪商是否接受</text>
<rect x="1020" y="95" width="140" height="130" rx="14" fill="#08744d"/><text x="1037" y="128" font-family="Microsoft YaHei UI" font-size="17" font-weight="700" fill="#fff">5 · 成交事实</text><text x="1037" y="158" font-family="Microsoft YaHei UI" font-size="13" fill="#eafff6">真实订单号</text><text x="1037" y="181" font-family="Microsoft YaHei UI" font-size="13" fill="#eafff6">成交价格</text><text x="1037" y="204" font-family="Microsoft YaHei UI" font-size="13" fill="#eafff6">MT4 回执</text>
<rect class="box" x="775" y="310" width="240" height="110" rx="14"/><text class="t bh" x="792" y="343">6 · 动态持仓管理</text><text class="t b" x="792" y="372">持有 / 加仓 / 减仓 / 保护 / 退出</text><text class="t b" x="792" y="395">做多和做空采用对称逻辑</text>
<rect class="box" x="530" y="310" width="190" height="110" rx="14"/><text class="t bh" x="547" y="343">7 · 交易结果</text><text class="t b" x="547" y="372">退出 + 盈亏回执</text><text class="t b" x="547" y="395">关联判断与数据版本</text>
<rect class="box" x="285" y="310" width="190" height="110" rx="14"/><text class="t bh" x="302" y="343">8 · 评估与归因</text><text class="t b" x="302" y="372">评估账本 + 策略统计</text><text class="t b" x="302" y="395">不把创建伪装成成功</text>
<rect class="box" x="45" y="310" width="185" height="110" rx="14"/><text class="t bh" x="62" y="343">9 · 下一版本</text><text class="t b" x="62" y="372">形成可解释建议</text><text class="t b" x="62" y="395">确认 / 比较 / 回滚</text><text class="t b" x="530" y="258" fill="#a44e35">拒绝 / 超时 / 未知 → 进入审计，绝不计为成交</text></svg>
