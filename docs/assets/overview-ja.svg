<text class="t sh" x="55" y="628">重要原則</text><text class="t b" x="55" y="656">最大保有数は目標ではなく上限です。AI 提案は約定ではなく、検証済み MT4 応答だけがリスク量を変更します。</text><text class="t s" x="55" y="684">React + TypeScript · Python + FastAPI · MQL4 + Node.js · LibreChat / オンライン / Ollama · OOS + Monte Carlo</text>
