<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="26" fill="#f3f7f4"/><style>.t{font-family:"Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;fill:#173f34}.h{font-size:26px;font-weight:700}.b{font-size:14px}.bh{font-size:17px;font-weight:700}.box{fill:#fff;stroke:#69a68e;stroke-width:1.5}.a{stroke:#148158;stroke-width:3;fill:none}.d{stroke:#bd6b4f;stroke-width:2.5;stroke-dasharray:6 5;fill:none}</style><text class="t h" x="48" y="52">判断サイクル：AI 提案と実行事実を分離</text><path class="a" d="M230 160H285M475 160H530M720 160H775M965 160H1020"/><path class="a" d="M1090 225V310H910M775 365H720M530 365H475M285 365H230"/><path class="d" d="M870 225V270H615V225M625 310V270"/>
<rect class="box" x="45" y="95" width="185" height="130" rx="14"/><text class="t bh" x="62" y="128">1 · AI 提案</text><text class="t b" x="62" y="158">根拠・生成時刻</text><text class="t b" x="62" y="181">理由・確信度</text><text class="t b" x="62" y="204">無効条件・候補値</text>
<rect class="box" x="285" y="95" width="190" height="130" rx="14"/><text class="t bh" x="302" y="128">2 · リスク候補</text><text class="t b" x="302" y="158">実口座容量</text><text class="t b" x="302" y="181">利用者上限・証拠金</text><text class="t b" x="302" y="204">選択された制約</text>
<rect class="box" x="530" y="95" width="190" height="130" rx="14"/><text class="t bh" x="547" y="128">3 · 待機指令</text><text class="t b" x="547" y="158">一意の要求 ID</text><text class="t b" x="547" y="181">冪等な再試行</text><text class="t b" x="547" y="204">まだ保有へ加算しない</text>
<rect class="box" x="775" y="95" width="190" height="130" rx="14"/><text class="t bh" x="792" y="128">4 · MT4 再検査</text><text class="t b" x="792" y="158">スプレッド・証拠金</text><text class="t b" x="792" y="181">許可・現在保有</text><text class="t b" x="792" y="204">ブローカー受理</text>
<rect x="1020" y="95" width="140" height="130" rx="14" fill="#08744d"/><text x="1037" y="128" font-family="Yu Gothic UI,Meiryo" font-size="17" font-weight="700" fill="#fff">5 · 約定事実</text><text x="1037" y="158" font-family="Yu Gothic UI,Meiryo" font-size="13" fill="#eafff6">注文番号</text><text x="1037" y="181" font-family="Yu Gothic UI,Meiryo" font-size="13" fill="#eafff6">約定価格</text><text x="1037" y="204" font-family="Yu Gothic UI,Meiryo" font-size="13" fill="#eafff6">MT4 応答</text>
<rect class="box" x="775" y="310" width="240" height="110" rx="14"/><text class="t bh" x="792" y="343">6 · 動的保有管理</text><text class="t b" x="792" y="372">維持・追加・縮小・保護・決済</text><text class="t b" x="792" y="395">買いと売りを対称に処理</text>
<rect class="box" x="530" y="310" width="190" height="110" rx="14"/><text class="t bh" x="547" y="343">7 · 結果</text><text class="t b" x="547" y="372">決済・損益応答</text><text class="t b" x="547" y="395">判断・データへ帰属</text>
<rect class="box" x="285" y="310" width="190" height="110" rx="14"/><text class="t bh" x="302" y="343">8 · 評価</text><text class="t b" x="302" y="372">台帳・戦略統計</text><text class="t b" x="302" y="395">成功を捏造しない</text>
<rect class="box" x="45" y="310" width="185" height="110" rx="14"/><text class="t bh" x="62" y="343">9 · 次の版</text><text class="t b" x="62" y="372">説明可能な提案</text><text class="t b" x="62" y="395">確認・比較・取消</text><text class="t b" x="530" y="258" fill="#a44e35">拒否・時間切れ・不明 → 監査。約定として数えない</text></svg>
