<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="26" fill="#f3f7f4"/><style>.t{font-family:"Segoe UI",Arial,sans-serif;fill:#173f34}.h{font-size:26px;font-weight:700}.b{font-size:14px}.bh{font-size:17px;font-weight:700}.box{fill:#fff;stroke:#69a68e;stroke-width:1.5}.a{stroke:#148158;stroke-width:3;fill:none}.d{stroke:#bd6b4f;stroke-width:2.5;stroke-dasharray:6 5;fill:none}</style><text class="t h" x="48" y="52">Decision cycle: recommendation is not execution</text><path class="a" d="M230 160H285M475 160H530M720 160H775M965 160H1020"/><path class="a" d="M1090 225V310H910"/><path class="a" d="M775 365H720M530 365H475M285 365H230"/><path class="d" d="M870 225V270H615V225M625 310V270"/>
<rect class="box" x="45" y="95" width="185" height="130" rx="14"/><text class="t bh" x="62" y="128">1 · AI proposal</text><text class="t b" x="62" y="158">Evidence + timestamp</text><text class="t b" x="62" y="181">Rationale + confidence</text><text class="t b" x="62" y="204">Invalidation + parameters</text>
<rect class="box" x="285" y="95" width="190" height="130" rx="14"/><text class="t bh" x="302" y="128">2 · Risk candidate</text><text class="t b" x="302" y="158">Account capacity</text><text class="t b" x="302" y="181">User ceiling + margin</text><text class="t b" x="302" y="204">Optional constraints</text>
<rect class="box" x="530" y="95" width="190" height="130" rx="14"/><text class="t bh" x="547" y="128">3 · Pending command</text><text class="t b" x="547" y="158">Unique request ID</text><text class="t b" x="547" y="181">Idempotent retry</text><text class="t b" x="547" y="204">No position counted yet</text>
<rect class="box" x="775" y="95" width="190" height="130" rx="14"/><text class="t bh" x="792" y="128">4 · MT4 recheck</text><text class="t b" x="792" y="158">Spread + margin</text><text class="t b" x="792" y="181">Permissions + positions</text><text class="t b" x="792" y="204">Broker acceptance</text>
<rect x="1020" y="95" width="140" height="130" rx="14" fill="#08744d"/><text x="1037" y="128" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#fff">5 · Fill truth</text><text x="1037" y="158" font-family="Segoe UI,Arial" font-size="13" fill="#eafff6">Order number</text><text x="1037" y="181" font-family="Segoe UI,Arial" font-size="13" fill="#eafff6">Fill price</text><text x="1037" y="204" font-family="Segoe UI,Arial" font-size="13" fill="#eafff6">MT4 receipt</text>
<rect class="box" x="775" y="310" width="240" height="110" rx="14"/><text class="t bh" x="792" y="343">6 · Active management</text><text class="t b" x="792" y="372">Hold / add / reduce / protect / exit</text><text class="t b" x="792" y="395">Long and short handled symmetrically</text>
<rect class="box" x="530" y="310" width="190" height="110" rx="14"/><text class="t bh" x="547" y="343">7 · Outcome</text><text class="t b" x="547" y="372">Exit + P&amp;L receipt</text><text class="t b" x="547" y="395">Decision/data attribution</text>
<rect class="box" x="285" y="310" width="190" height="110" rx="14"/><text class="t bh" x="302" y="343">8 · Evaluation</text><text class="t b" x="302" y="372">Ledger + strategy metrics</text><text class="t b" x="302" y="395">No fabricated success</text>
<rect class="box" x="45" y="310" width="185" height="110" rx="14"/><text class="t bh" x="62" y="343">9 · Next version</text><text class="t b" x="62" y="372">Explainable recommendation</text><text class="t b" x="62" y="395">Confirm / compare / rollback</text><text class="t b" x="530" y="258" fill="#a44e35">Reject / timeout / unknown → audit; never counted as a fill</text></svg>
