<text class="t sh" x="55" y="628">关键原则</text><text class="t b" x="55" y="656">最大持仓是上限，不是目标；AI 建议不是成交；只有经过验证的 MT4 回执才能改变真实风险敞口。</text><text class="t s" x="55" y="684">React + TypeScript · Python + FastAPI · MQL4 + Node.js · LibreChat / 在线模型 / Ollama · 样本外 + 蒙特卡洛</text>
