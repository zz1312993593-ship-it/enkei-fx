<text class="t sh" x="55" y="628">Key principle</text><text class="t b" x="55" y="656">Maximum positions are a ceiling, not a target. An AI proposal is not a fill. Only a verified MT4 receipt changes exposure.</text><text class="t s" x="55" y="684">React + TypeScript · Python + FastAPI · MQL4 + Node.js · LibreChat / online providers / Ollama · rolling OOS + Monte Carlo</text>
